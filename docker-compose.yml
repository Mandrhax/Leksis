services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: leksis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leksis
      POSTGRES_USER: leksis_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Persistent data — survives container restarts and updates
      - postgres_data:/var/lib/postgresql/data
      # Schema init — executed only once on first start (empty volume)
      - ./docker/init-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leksis_user -d leksis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - leksis-net

  # ── Ollama (LLM inference, GPU-accelerated) ─────────────────
  # Optional: only started when COMPOSE_PROFILES contains "ollama" (set in .env
  # by install.sh). Leave it out to use an Ollama server running elsewhere —
  # then point OLLAMA_BASE_URL at it.
  ollama:
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: leksis-ollama
    restart: unless-stopped
    volumes:
      # Persistent model storage — models survive updates
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_SCHED_SPREAD: ${OLLAMA_SCHED_SPREAD:-true}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - leksis-net

  # ── Leksis Application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leksis-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # required: false → ignored when the ollama profile is not enabled
      # (remote Ollama). Needs Docker Compose >= 2.20.
      ollama:
        condition: service_healthy
        required: false
    # Hardening: the app is an unprivileged Node process listening on 3000 — it needs no Linux capability
    # and must never gain new privileges. (Not applied to postgres / caddy / ollama, whose entrypoints
    # need to switch users or bind low ports.)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Lets the app reach an Ollama running on the Docker host itself
    # (OLLAMA_BASE_URL=http://host.docker.internal:11434).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database — resolved via internal Docker network
      DATABASE_URL: postgresql://leksis_user:${POSTGRES_PASSWORD}@postgres:5432/leksis

      # NextAuth
      AUTH_SECRET: ${AUTH_SECRET}
      # Leave NEXTAUTH_URL empty (default): the public address is detected from the
      # X-Forwarded-* / Host headers, so HTTP, HTTPS and reverse proxies all just work.
      # Set it only to pin one fixed address (it then overrides the detected one).
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      # Read by the admin panel to show the current access mode (Services → Caddy)
      CADDY_HOST: ${CADDY_HOST:-:80}

      # Encryption key (AES-256-GCM, 64 hex chars)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Ollama — internal container by default, or a remote server (see .env).
      # The admin panel (Services → AI) overrides this once saved.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # AI engine: "ollama" or "openai" (any OpenAI-compatible API — vLLM, LM Studio, llama.cpp, OpenAI…)
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-${OLLAMA_BASE_URL:-http://ollama:11434}}
      AI_API_KEY: ${AI_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_OCR_MODEL: ${OLLAMA_OCR_MODEL}
      OLLAMA_REWRITE_MODEL: ${OLLAMA_REWRITE_MODEL}
      # Upload directory for logo and background images (outside /app/ to avoid permission issues)
      UPLOAD_DIR: /data/uploads
    volumes:
      # Persistent uploads (logo, background) — survives container restarts and updates
      - leksis_uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - leksis-net

  # ── Caddy Reverse Proxy ──────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: leksis-caddy
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --resume
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    environment:
      CADDY_HOST: ${CADDY_HOST}
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - leksis-net

# ── Networks ────────────────────────────────────────────────
networks:
  leksis-net:
    driver: bridge

# ── Volumes ─────────────────────────────────────────────────
volumes:
  postgres_data:
  ollama_data:
  leksis_uploads:
  caddy_data:
