name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # same as the Dockerfile
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Only what ships to customers: dev tooling advisories do not block a release
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # Real browser: sign-in → workspace → sign-out (the journey that broke in two betas)
      - name: End-to-end
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
