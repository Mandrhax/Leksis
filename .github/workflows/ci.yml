name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04 # pinned: Chrome path and runner image stay predictable
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # same as the Dockerfile
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Only what ships to customers: dev tooling advisories do not block a release
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # Real browser: sign-in → workspace → sign-out (the journey that broke in two betas)
      - name: End-to-end
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # The Dockerfile is what customers actually run: build it on every push (not pushed anywhere)
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # install.sh runs as root on customer servers: syntax and shellcheck errors (warnings are not blocking)
  install-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash -n install.sh
      - run: shellcheck --severity=error install.sh
